services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: appdiag-phase4e-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: appdiag
      RABBITMQ_DEFAULT_PASS: appdiag-local
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: appdiag-phase4e-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
