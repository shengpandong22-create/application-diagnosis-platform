name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync development dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff
        run: uv run --frozen ruff check .

      - name: Tests
        run: uv run --frozen python -m pytest -q
