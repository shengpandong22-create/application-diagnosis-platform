<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" width="100%" role="img">
  <title>ToolLoopRunner 内部循环</title>
  <desc>展示 LLM 输出工具调用后，经过确定性校验、工具执行、Evidence 留存和结果反馈继续循环，最终进入结论校验。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif}
      .title{font-size:19px;font-weight:700}
      .sub{font-size:14px}
      .small{font-size:12px}
      .coral{fill:#fff0eb;stroke:#d85a30;stroke-width:1.3}
      .blue{fill:#e8f3ff;stroke:#2368ad;stroke-width:1.3}
      .green{fill:#e2f6ef;stroke:#14715a;stroke-width:1.3}
      .purple{fill:#f0edff;stroke:#6656c7;stroke-width:1.3}
      .amber{fill:#fff1dd;stroke:#be7718;stroke-width:1.3}
      .line{stroke:#5f5e5a;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#6656c7;stroke-width:2.2;fill:none;stroke-dasharray:8 8;marker-end:url(#arrow)}
    </style>
  </defs>

  <text x="560" y="38" text-anchor="middle" class="title" fill="#3e358d">一轮 tool-calling：概率性决策穿过确定性边界</text>

  <rect x="40" y="100" width="170" height="116" rx="16" class="coral"/>
  <text x="125" y="132" text-anchor="middle" class="title" fill="#733016">LLM 决策</text>
  <text x="125" y="166" text-anchor="middle" class="sub" fill="#9b3f20">选择工具</text>
  <text x="125" y="190" text-anchor="middle" class="sub" fill="#9b3f20">生成参数</text>
  <text x="125" y="73" text-anchor="middle" class="sub" fill="#9b3f20">概率性</text>

  <line x1="210" y1="158" x2="270" y2="158" class="line"/>
  <rect x="274" y="100" width="190" height="116" rx="16" class="blue"/>
  <text x="369" y="130" text-anchor="middle" class="title" fill="#0c477f">确定性校验</text>
  <text x="369" y="164" text-anchor="middle" class="sub" fill="#2368ad">白名单 / 参数</text>
  <text x="369" y="188" text-anchor="middle" class="sub" fill="#2368ad">权限 / 预算</text>
  <text x="369" y="73" text-anchor="middle" class="sub" fill="#2368ad">确定性</text>

  <line x1="464" y1="158" x2="524" y2="158" class="line"/>
  <rect x="528" y="100" width="170" height="116" rx="16" class="green"/>
  <text x="613" y="130" text-anchor="middle" class="title" fill="#075141">Tool 执行</text>
  <text x="613" y="164" text-anchor="middle" class="sub" fill="#14715a">Tool Registry</text>
  <text x="613" y="188" text-anchor="middle" class="sub" fill="#14715a">Port → Adapter</text>

  <line x1="698" y1="158" x2="758" y2="158" class="line"/>
  <rect x="762" y="100" width="190" height="116" rx="16" class="green"/>
  <text x="857" y="130" text-anchor="middle" class="title" fill="#075141">证据留存</text>
  <text x="857" y="164" text-anchor="middle" class="sub" fill="#14715a">工具结果 → Evidence</text>
  <text x="857" y="188" text-anchor="middle" class="sub" fill="#14715a">返回正式 Evidence ID</text>

  <line x1="952" y1="158" x2="1012" y2="158" class="line"/>
  <rect x="1016" y="100" width="80" height="116" rx="16" class="coral"/>
  <text x="1056" y="139" text-anchor="middle" class="sub" font-weight="700" fill="#733016">结果</text>
  <text x="1056" y="166" text-anchor="middle" class="sub" font-weight="700" fill="#733016">反馈</text>
  <text x="1056" y="190" text-anchor="middle" class="small" fill="#9b3f20">tool_result</text>

  <path d="M1056 216 L1056 350 L125 350 L125 220" class="loop"/>
  <text x="560" y="382" text-anchor="middle" class="sub" fill="#5b4fc3">继续循环：LLM 基于工具结果重新判断，直到结论、等待输入或预算耗尽</text>

  <rect x="345" y="420" width="430" height="64" rx="16" class="purple"/>
  <text x="560" y="445" text-anchor="middle" class="sub" font-weight="700" fill="#3e358d">最终结论分支</text>
  <text x="560" y="468" text-anchor="middle" class="small" fill="#5b4fc3">Schema 校验 / Citation Policy / 置信等级 / 禁止模型直接 confirmed</text>
  <line x1="560" y1="384" x2="560" y2="416" class="line"/>
</svg>
